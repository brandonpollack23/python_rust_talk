[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "loss_graph"
version = "0.1.0"
description = "A Rust-powered TUI loss graph visualization for Python"
requires-python = ">=3.8"

[dependency-groups]
dev = ["maturin>=1.4,<2.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
