[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "loss_graph"
version = "0.1.0"
description = "A Rust-powered TUI loss graph visualization for Python"
requires-python = ">=3.8,<3.14"
dependencies = ["numpy>=1.20"]

[dependency-groups]
dev = ["maturin>=1.4,<2.0"]

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "**/*.rs" },
]
